services:
  
  nginx:
    image: nginx:alpine
    ports:
      - "${HOST_PORT:-17380}:80"
    volumes: 
      - ./nginx/canvas.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - web
    restart: unless-stopped

  web:
    build:
      context: ./canvas-lms
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
    command: bundle exec rails server -b 0.0.0.0 -p 3000
    environment:
      #Este se debe modificar cuando nos vayamos a prod
      RAILS_ENV: development
      CANVAS_LMS_ADMIN_EMAIL: ${CANVAS_LMS_ADMIN_EMAIL}
      CANVAS_LMS_ADMIN_PASSWORD: ${CANVAS_LMS_ADMIN_PASSWORD}
      CANVAS_LMS_ACCOUNT_NAME: ${CANVAS_LMS_ACCOUNT_NAME}
      # El contenedor no tiene ruta IPv6 pero hosts como registry.yarnpkg.com
      # devuelven AAAA; sin esto Node intenta IPv6 primero y falla con ENETUNREACH
      NODE_OPTIONS: --dns-result-order=ipv4first
      # Fuerza que PostgreSQL se conecte a canvas_development por defecto
      PGDATABASE: canvas_development
      # Desactiva el sistema de sharding de Switchman para deployments de una sola instancia
      # (Switchman intenta cargar config de shards de una BD "canvas" que no existe)
      SKIP_FORCE_SHARDING: "1"
    volumes:
      - ./canvas-lms:/usr/src/app:z
      - canvas_node_modules:/usr/src/app/node_modules
      - canvas_packs:/usr/src/app/public/packs
      - canvas_bundle:/home/docker/.bundle
      - canvas_gems:/home/docker/.gem
      - canvas_yarn_cache:/home/docker/.cache/yarn
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped


  jobs:
    build:
      context: ./canvas-lms
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
    command: bundle exec script/delayed_job run
    environment:
      RAILS_ENV: development
      NODE_OPTIONS: --dns-result-order=ipv4first
      # Fuerza que PostgreSQL se conecte a canvas_development por defecto
      PGDATABASE: canvas_development
      # Desactiva el sistema de sharding de Switchman para deployments de una sola instancia
      SKIP_FORCE_SHARDING: "1"
    volumes:
      - ./canvas-lms:/usr/src/app:z
      - canvas_node_modules:/usr/src/app/node_modules
      - canvas_bundle:/home/docker/.bundle
      - canvas_gems:/home/docker/.gem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  rce:
    image: instructure/canvas-rce-api
    environment:
      PORT: 3001
      ECOSYSTEM_KEY: ${RCE_ECOSYSTEM_KEY}
      ECOSYSTEM_SECRET: ${RCE_ECOSYSTEM_SECRET}
      STATSD_HOST: ${STATSD_HOST:-localhost}
      STATSD_PORT: ${STATSD_PORT:-8125}
    restart: unless-stopped

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: canvas_development
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "canvas"]
      interval: 5s
      timeout: 5s 
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes: 
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  canvas_node_modules:
  canvas_packs:
  canvas_bundle:
  canvas_gems:
  canvas_yarn_cache:

