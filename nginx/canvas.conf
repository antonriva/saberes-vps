upstream canvas {
	server web:3000;
}

upstream rce {
	server rce:80;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
	default $http_x_forwarded_proto;
	''      $scheme;
}

server {
	listen 80;
	server_name localhost;

	client_max_body_size 500M;

	# Proxy RCE API requests
	location /rce/ {
	  proxy_pass         http://rce/;
          proxy_set_header   Host              $http_host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $proxy_x_forwarded_proto;
          proxy_read_timeout    300;
          proxy_connect_timeout 300;
          proxy_send_timeout    300;
          proxy_buffering    off;
          # CORS headers para permitir credenciales en requests cross-origin
          add_header 'Access-Control-Allow-Origin' '$http_origin' always;
          add_header 'Access-Control-Allow-Credentials' 'true' always;
          add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
          add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-CSRF-Token' always;

          # Manejar preflight requests
          if ($request_method = 'OPTIONS') {
            return 204;
          }
	}

	# Send the bare domain straight to the public course catalog
	location = / {
	  return 302 /search/all_courses;
	}

	# Proxy Canvas requests
	location / {
	  proxy_pass         http://canvas;
          proxy_set_header   Host              $http_host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $proxy_x_forwarded_proto;
          proxy_read_timeout    300;
          proxy_connect_timeout 300;
          proxy_send_timeout    300;
          proxy_buffering    off;
	}

}
